<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
        height: 300px;
        width: 300px;
        border: 1px solid;
        background: linear-gradient(red, yellow, purple, rgb(238, 108, 130));
    }
    p{
        height: 300px;
        width: 300px;
        border: 1px solid;
        background: radial-gradient(yellow, orange, red);
    }
    #p2{
        /* background: conic-gradient(red, blue, orange); */
        background: -moz-linear-gradient(green, violet, red);
        
    }
    h1{
        
        text-transform: uppercase;
        font-size: 5rem;
        background: linear-gradient(red, blue, green);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
    }
</style>
<body>
    <div></div>
    <p></p>

    <h1>Welcome to CSS</h1>

</html>
