<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - BiteBox</title>
</head>
<body>
    <h1>Contact Us</h1>

    <p>
        <a href="index.html">Home</a>
        |
        <a href="menu.html">Menu</a>
        |
        <a href="about.html">About</a>
        |
        <a href="contact.html">Contact</a>
    </p>


    <hr>

    <h2>Customer Registration & order Form</h2>
    <form>

        <h3>Customer Information</h3> 

        <label for="name">Full Name</label> <br>
        <input type="text" name="name" id="name"> <br><br>

        <label for="email">Email Address</label><br>
        <input type="email" name="email" id="email"> <br><br>

        <label for="password">Password</label><br>
        <input type="password" name="password" id="password"> <br><br>

        <label for="Phone">Phone Number</label><br>
        <input type="tel" name="Phone" id="phone"> <br><br>


        <h3>Order Information</h3>

        <label for="quantity">Quantity</label><br>
        <input type="number" name="qty" id="quantity"> <br><br>

        <label for="date">Preferred Delivery Date</label><br>
        <input type="date" name="date" id="date"> <br><br>

        <label for="food">Select Food Item</label><br>
        <select name="food" id="food">
            <option>Veg Pizza</option>
            <option>Cheese Burger</option>
            <option>White Sauce Pasta</option>
            <option>Veg Grilled Sandwich</option>
            <option>Chocolate Brownie</option>
        </select>

        <h3>Payment Method</h3>

        <input type="radio" name="payment" id="cash">
        <label for="cash">Cash</label> <br>

        <input type="radio" name="payment" id="card">
        <label for="card">Card</label> <br>
   
        <input type="radio" name="payment" id="upi">
        <label for="upi">UPI</label>

        <h3>Extras</h3>
        <input type="checkbox" name="extras" id="cheese">
        <label for="cheese">Extra Cheese</label> <br>
        
        <input type="checkbox" name="extras" id="drink">
        <label for="drink">Cold Drink</label> <br>

        <input type="checkbox" name="extras" id="dessert">
        <label for="dessert">Dessert</label>


        <h3>Delivery Instructions</h3>
        <label for="address">Delivery Address</label> <br>
        <textarea name="address" id="address" rows="5" cols="40"></textarea> <br><br>

        <input type="submit" value="Place Order">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
